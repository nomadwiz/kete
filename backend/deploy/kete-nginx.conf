# nginx site for the Kete API on the EC2 instance.
#
# The deploy workflow (.github/workflows/deploy-backend.yml) copies this to
# /etc/nginx/conf.d/kete.conf, checks it with `nginx -t` and reloads nginx on
# every deploy, so edit it here, never on the instance.
#
# nginx is the only thing listening publicly. uvicorn stays on 127.0.0.1:8000
# (see kete-api.service), so the API is never exposed directly.

# --- Rate limit on signing in and registering. B30 (#399). ---
#
# Each attempt costs a 240,000-iteration PBKDF2 hash (security.py), so without a
# limit a script could guess passwords without pause and tie up the CPU. The
# limit is ten POSTs a minute per client to /login and /register together: the
# first ten pass at once, and the eleventh within the minute is refused.
#
# Who the client is. Behind CloudFront, $remote_addr is a CloudFront edge
# server shared by many people, so the zone is keyed on the address CloudFront
# appends to X-Forwarded-For. Only the last entry is CloudFront's; anything
# before it is whatever the client sent, so it is ignored. With no header, the
# connecting address is the client.
map $http_x_forwarded_for $kete_viewer_addr {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                 $remote_addr;
}

# Only POST counts. The browser sends an OPTIONS preflight before each POST,
# and counting it would halve the allowance. An empty key is not limited.
map $request_method $kete_auth_viewer {
    POST    $kete_viewer_addr;
    default "";
}

# A second, wider limit on the connecting address. Until port 80 is closed to
# everything but CloudFront (K18, #396), a client reaching the instance directly
# could send a new X-Forwarded-For on every request and never meet the first
# limit. This one it cannot vary. It is wide because, through CloudFront, one
# connecting address is an edge server carrying many people's requests.
map $request_method $kete_auth_peer {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $kete_auth_viewer zone=kete_auth_viewer:10m rate=10r/m;
limit_req_zone $kete_auth_peer   zone=kete_auth_peer:10m   rate=120r/m;

# The 429 carries the client's origin back only when it is the client's own
# address, as the API's CORS_ORIGINS does for its other answers. Without it the
# browser hides the 429 from the client, which then shows a network error
# instead of the message. Keep this list in step with CORS_ORIGINS in the
# instance's backend/.env.
map $http_origin $kete_cors_origin {
    "https://d3u257bu1qqv0l.cloudfront.net"     $http_origin;
    "~^http://(localhost|127\.0\.0\.1):7377$"   $http_origin;
    default                                     "";
}

server {
    # default_server on both families: Amazon Linux's stock nginx.conf carries
    # a welcome-page server on port 80, and without this it answers any request
    # that arrives over IPv6.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kete-api;

    # Recipe photographs are uploaded through the API, which refuses anything
    # over storage.MAX_BYTES (5 MB) with its own 413 and message. This must stay
    # above that plus the multipart overhead, or nginx answers first with a bare
    # HTML 413 the client cannot read. nginx's own default is 1 MB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(login|register)$ {
        limit_req zone=kete_auth_viewer burst=9 nodelay;
        limit_req zone=kete_auth_peer burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @kete_too_many;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # In the shape of every other error the API gives, so the client's error
    # handling shows the message. An empty value leaves the header out.
    location @kete_too_many {
        default_type application/json;
        add_header Access-Control-Allow-Origin $kete_cors_origin always;
        add_header Vary Origin always;
        return 429 '{"detail":"Too many attempts. Wait a minute and try again."}';
    }
}
