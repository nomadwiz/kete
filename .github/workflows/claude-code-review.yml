# Reviews every pull request with the agent-skills and ponytail plugins and posts
# the result as a request-changes review, not a comment. A comment is something to
# scroll past; a review is a state the author has to answer.
#
# The other half of this runs in nomadwiz/kete-doc and reads this repository. This
# one reads that one, because the two drift in opposite directions and only the
# direction guarded here is expensive: the documents say what Kete should be, so a
# change that departs from one is a defect in the change.
#
# The documents are checked out at kete-doc/, not at the parent of this repository,
# although CLAUDE.md links to them as ../doc/... . Checking them out over the
# workspace root would replace this file on disk with that repository's copy of it,
# and claude-code-action refuses to run when this file differs from the copy on the
# default branch. The prompt translates the paths instead.
#
# Repository secrets this needs (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  the Claude Code subscription token
#   KETE_CROSS_REPO_TOKEN    a fine-grained personal access token with
#                            Contents: read on nomadwiz/kete and
#                            nomadwiz/kete-doc. Both repositories are private, so
#                            the default GITHUB_TOKEN cannot read the other one.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: write # merge a clean pull request, and update one that is behind
  pull-requests: write # submit a review, and dismiss the previous one
  issues: read
  actions: write # dispatch the backend deploy after a merge (S17, #339)
  id-token: write

# A second push while a review is running cancels the first, so two reviews never
# race onto one pull request.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is not reviewed. ready_for_review is already a trigger, so nothing
    # is lost: the review runs the moment the draft flag comes off.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the reviewer reads history; depth 1 has none

      # doc/contributing.md pins the review rule's start to a commit in
      # this repository, and several documents assert SHAs in it, so the documents
      # come with their full history too.
      - name: Check out the documents
        uses: actions/checkout@v4
        with:
          repository: nomadwiz/kete-doc
          ref: master # kete-doc's default branch is master, not main
          path: kete-doc
          token: ${{ secrets.KETE_CROSS_REPO_TOKEN }}
          fetch-depth: 0

      # A CHANGES_REQUESTED review stays in force across every later push. A
      # COMMENT review does not clear it, and GITHUB_TOKEN is forbidden from
      # APPROVE, which is the one event that would. Without this step the first
      # run that finds a nit blocks the pull request until somebody dismisses it
      # by hand, and the reviewer becomes something people work around.
      - name: Dismiss the previous review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select((.user.login == "claude[bot]" or .user.login == "github-actions[bot]") and .state == "CHANGES_REQUESTED") | .id' \
          | while read -r id; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message='Superseded by a newer review.' -f event=DISMISS
            done

      # The agent-skills plugin's manifest names a github source, and the plugin
      # installer clones that over SSH, which a runner has no key for. Ponytail is
      # unaffected: its manifest declares source "./", so it installs from the
      # marketplace clone already on disk and never fetches again. The rewrite is
      # safe because the clone is anonymous and the repository is public — the
      # extraheader actions/checkout leaves behind is per-repository and does not
      # reach the plugin cache.
      - name: Let the plugin installer clone over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Record when the review starts, so the guard below can tell this run's
      # verdict from one an earlier run left behind.
      - name: Note the start time
        run: echo "REVIEW_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          # Passed for the read-only gh calls. The verdict itself is posted by
          # claude[bot]: the action supplies its own app token to Claude and this
          # value does not win. The dismissal step matches both logins for that
          # reason — get it wrong and a request-changes review never clears.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/addyosmani/agent-skills.git
            https://github.com/DietrichGebert/ponytail.git
          plugins: |
            agent-skills@addy-agent-skills
            ponytail@ponytail
          claude_args: >-
            --model claude-opus-5-5 --effort high
            --allowedTools "Read,Grep,Glob,Write,Task,Skill,SlashCommand,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(jq:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}, the Kete application. The working directory is that repository. The documents repository, nomadwiz/kete-doc, is checked out at `kete-doc/` on its `master` branch with full history.

            ## Read the contract first

            Read `CLAUDE.md` in the working directory, then `kete-doc/CLAUDE.md` and `kete-doc/doc/contributing.md`.

            `CLAUDE.md` links to the documents as `../doc/...`, which is where they sit in a working clone. Here they are under `kete-doc/doc/` — so `../doc/design/product.md` is `kete-doc/doc/design/product.md`. Translate every such link; none of them is broken.

            Enforce what those files say. Do not restate them, do not reinterpret them, and do not apply a rule they do not contain. `CLAUDE.md` is deliberately a map: where it and the file it points at disagree, the other file is right.

            Three of its rules decide most reviews here, so check them on every change:

            - **Scope.** `kete-doc/doc/design/product.md` section 5 lists what Kete deliberately does not do, and `kete-doc/doc/design/implementation.md` section 5 what was reviewed and must not be "improved". Building something from either list is the defect to catch first.
            - **Lanes.** `kete-doc/doc/design/ownership.md` maps each path to an owner. A change reaching into another lane's files takes that member's contribution evidence away from them, and `kete-doc/doc/contributing.md` compels a person's review for it.
            - **Review.** `kete-doc/doc/contributing.md` compels a person's review when a change touches another lane's files, changes the API contract or the database schema, changes the scope in `product.md`, or changes the rules. It asks the author to open such a pull request as a draft while that person reads it, and to say in one line which they chose. Flag a pull request that meets one of those tests and says nothing — a finding here is what stops this review merging it before the person has read it.

            ## Earlier rounds

            Every push to this pull request runs this review again. A run that does not know what earlier rounds said finds something new in lines they already passed, and the pull request never converges. So read them first:

            ```
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --paginate --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | {id, state, commit_id, submitted_at, body}]'
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate
            ```

            - **None:** this is the first round. Review the whole diff.
            - **Otherwise** the latest one's `commit_id` is the last reviewed commit, and this round does two things and no more. First, under `### Earlier findings` in the body, say for each earlier blocker whether it is fixed, still open, or answered in a reply. Second, review `git diff <last reviewed commit>..${{ github.event.pull_request.head.sha }}` — only what changed since — and run both reviewers over that diff, not the whole pull request.
            - A blocker still open is a blocker of this round too: restate it in `comments` if its line is still in the diff, otherwise in the body.
            - A line an earlier round read and passed is not reopened. Advice an earlier round gave is not reversed unless following it introduced a blocker; where you do reverse one, name the round and say why.
            - Where `git log -1 <last reviewed commit>` fails, the branch was rewritten: review the whole diff as a first round.

            ## Run both reviewers over the diff

            - `/agent-skills:review` for correctness, architecture and security.
            - `/ponytail:ponytail-review` for what can be deleted.

            ## Check the two repositories for drift

            The documents say what Kete should be. The code says what it is. Report a mismatch, name both sides, and resolve neither — which side moves is the author's decision, not yours.

            `CLAUDE.md` says "The code beats every description of it." Read that as descriptive, not normative: the code is the authority on what exists, the documents on what should exist. Do not use that sentence to close a finding. Its own last clause says the difference is worth raising as an issue.

            **Here the expensive direction is the change.** A document going stale about correct code is cheap and the documents repository's own reviewer catches it. A change departing from a document that was not updated with it is what this review is for. Where the diff makes a document wrong, say which document and which line.

            **Only a present-tense claim can drift.** A count or a statement inside a dated historical record is correct as written and must not be flagged: a commit message describing what was true then, a delivery-stage table describing that stage, an ADR describing what was true when it was written.

            Three checks, cheapest first:

            1. `jq '[.paths[] | keys[]] | length' backend/openapi.json` gives the operation count and `jq -r '.paths | keys[]' backend/openapi.json` the routes. Compare both against every present-tense endpoint count and route list in `kete-doc/doc/`, section 10 of `kete-doc/doc/output/report.md` in particular, since that is where the brief requires the access URLs.
            2. Where the diff adds, removes or renames a route, a table, a column or a file the documents name, say which document now needs changing.
            3. Any present-tense claim in `kete-doc/doc/` about what the system does, against what this diff makes it do.

            ## Post exactly one review

            One API call carries the verdict and every inline comment together. Write the JSON to a file, confirm it parses with `jq . <file>`, then post it:

            ```
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input <file>
            ```

            The file:

            ```json
            {
              "event": "REQUEST_CHANGES",
              "body": "<the summary>",
              "comments": [
                {"path": "<path>", "line": <line>, "side": "RIGHT", "body": "<the finding>"}
              ]
            }
            ```

            Use `"event": "COMMENT"` with an empty `comments` array when you found nothing. Never `"APPROVE"`: the token is forbidden from it and the call fails.

            **Only a blocker blocks.** A blocker is a correctness or security defect, a breach of a rule the files above state, or drift between the repositories. Everything else — wording, a tighter phrasing, an optional cut, most of what `/ponytail:ponytail-review` finds — is a suggestion. A suggestion goes in the body under `### Suggestions`, never in `comments`, and never makes the verdict `REQUEST_CHANGES`. `comments` holds blockers only.

            **A clean verdict merges the pull request.** A `COMMENT` carrying a summary and no inline comments is squash-merged by the step that runs after you, without anybody looking at it first. So post one only where you would merge the change yourself, and use `REQUEST_CHANGES` only when at least one finding blocks — and a pull request that meets one of the review tests above and asked for nobody always blocks.

            Every `line` must be one the diff touches, or GitHub rejects the whole review with a 422. `side` is `"RIGHT"` for an added or changed line and `"LEFT"` for a removed one. A finding about a file the diff does not touch goes in the body, not in `comments`.

            **Post nothing separately — one review is the deliverable.** Comments without a verdict leave the pull request unblocked with findings scattered through it, and a verdict without its comments makes the author hunt for the lines. A run that posts comments and no verdict fails the job.

            Open the body with one sentence saying whether anything blocks. Then group the findings under `### Correctness`, `### Drift against the documents`, `### Project rules` and `### Suggestions`, leaving out any group that is empty. Quote the rule or the document you measured against, so the author can check your reading. A finding with no file and line is not a finding.

            Report only what you can point at. Where something cannot be determined from this code and those documents, say so and stop. Never pick the most plausible reading and carry on.

      # A run that posted inline comments and no verdict still reported success,
      # and the pull request then sat unblocked with findings scattered over it.
      # Three silent successes in this workflow's first day earned this guard.
      - name: Fail if no verdict was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.submitted_at > \"$REVIEW_SINCE\") | select((.body|length) > 0)] | length")
          [ "$n" -gt 0 ] || { echo "The review step posted no verdict for this run." >&2; exit 1; }
          echo "Verdict posted."

      # Claude merges what it found clean, so a pull request nothing is blocking
      # does not wait on somebody noticing that nothing is blocking it.
      #
      # Clean means all three: this run posted a verdict, the verdict is a plain
      # COMMENT rather than CHANGES_REQUESTED, and it carries no inline findings.
      # All three are needed, because COMMENTED alone does not mean clean — the
      # runs of 01-10-2026 that posted comments and no verdict landed as COMMENTED
      # too, with an empty body and one inline comment each (kete-doc#27).
      #
      # The decision is deliberately not Claude's. The diff under review is
      # untrusted input, and a model holding the merge button is a model a diff can
      # argue into merging. This step reads the verdict already posted and the
      # API's own counts, so nothing inside a pull request can move it.
      - name: Merge what the review found clean
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          id=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.submitted_at > \"$REVIEW_SINCE\")
                       | select(.state == \"COMMENTED\")
                       | select((.body|length) > 0)] | last | .id // empty")
          if [ -z "$id" ]; then
            echo "This run requested changes, or posted no clean verdict. Not merging."
            exit 0
          fi

          findings=$(gh api "repos/$REPO/pulls/$PR/reviews/$id/comments" --jq 'length')
          if [ "$findings" -ne 0 ]; then
            echo "The verdict carries $findings inline findings. Not merging."
            exit 0
          fi

          # A branch behind its base was reviewed against something that is no
          # longer what it will become, which is #302's lesson. Update it and stop:
          # the update pushes, that push is another synchronize event, and the run
          # it fires reviews the merged result and merges it.
          #
          # The update merges $BASE into the branch. It is never a rebase, because
          # kete-doc/doc/overview.md forbids history-rewriting operations and a
          # rebase of a pushed branch needs a force push to land.
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.behind_by')
          if [ "$behind" -gt 0 ]; then
            if gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" --silent 2>/dev/null; then
              echo "Branch was $behind commits behind $BASE. Updated; the next run merges it."
            else
              echo "Branch is $behind commits behind $BASE and will not update — a conflict. Left open."
            fi
            exit 0
          fi

          # Squashed, so one pull request is one commit on $BASE. GitHub writes a
          # Co-authored-by trailer for every author in the squashed range, which is
          # what keeps this inside kete-doc/doc/contributing.md's authorship rule
          # rather than being the squash that rule forbids.
          if gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash --silent; then
            echo "Merged #$PR."
          else
            echo "Merge refused. Left open for a person."
            exit 0
          fi

          # A push made with github.token starts no workflow, so deploy-backend.yml's
          # push trigger never sees this merge (S17, #339). workflow_dispatch is the
          # documented exception. The pattern below copies that file's push paths:
          # change the two together. The file list is read into a variable first,
          # because grep -q in a pipe ends early and pipefail would then fail the
          # condition and skip the deploy.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ "$BASE" = main ] &&
             grep -qE '^(backend/|\.github/workflows/deploy-backend\.yml$)' <<<"$files"; then
            gh workflow run deploy-backend.yml --repo "$REPO" --ref main
            echo "Dispatched deploy-backend.yml on main."
          fi
