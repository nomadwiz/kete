# Deploys the backend to the EC2 instance on every push to main that touches
# backend/. Tests run first; a failing test stops the deploy.
#
# The runner copies the tested commit to the instance over SSH, so the instance
# holds no GitHub credentials and never pulls anything itself. The instance's
# backend/.env (secrets) and .venv are excluded from the copy and never
# overwritten.
#
# Repository secrets this needs (Settings -> Secrets and variables -> Actions):
#   EC2_HOST         public DNS name or IP of the instance
#   EC2_USER         login user, "ec2-user" on Amazon Linux 2023
#   EC2_SSH_KEY      the full private key (.pem) for that user
#   EC2_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <EC2_HOST>`, run once,
#                    so the runner refuses to talk to an impostor host

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  # A pull request runs the tests only, so a change is known to pass under the
  # server's Python before it merges. Only a push to main deploys.
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two merges in quick succession deploy one after the other, never interleaved.
# A group holds one running and one pending run, and a newly queued run cancels
# the pending one, so a pull request's test-only run waits in a group of its
# own: in this one it would cancel a merge's waiting deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-backend-pr-{0}', github.ref) || 'deploy-backend' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Most of the tests check how PostgreSQL's own constraints behave, so they
    # need a real one; without it conftest.py would skip them and the job would
    # still go green (S15, #305). 18, the major version RDS runs.
    #
    # The database is kete_test, not kete: with no .env here the API's own
    # database defaults to localhost/kete, and conftest.py refuses to wipe that.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"   # the python3.12 the instance runs the API with
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kete_test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Secrets reach the shell as environment variables, never pasted into the
      # script text. The host and user are stripped of whitespace: a value pasted
      # into GitHub's secret form easily keeps a trailing newline, which ssh
      # rejects as "hostname contains invalid characters".
      - name: Load the SSH key, the pinned host key and the host alias
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          host=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          printf 'Host kete\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ec2\n  IdentitiesOnly yes\n' \
            "$host" "$user" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copy the backend to the instance
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' --exclude '.venv/' \
            --exclude '__pycache__/' --exclude '.pytest_cache/' --exclude 'tests/' \
            backend/ kete:kete/backend/

      - name: Install dependencies, restart, and check it came back
        run: |
          ssh kete '
            set -e
            cd ~/kete/backend
            [ -d .venv ] || python3.12 -m venv .venv
            .venv/bin/pip install --quiet -r requirements.txt
            sudo cp deploy/kete-api.service /etc/systemd/system/kete-api.service
            sudo systemctl daemon-reload
            sudo systemctl enable kete-api
            sudo systemctl restart kete-api
            sudo cp deploy/kete-nginx.conf /etc/nginx/conf.d/kete.conf
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl reload-or-restart nginx
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/health; then
                # The API is up; now prove the public path through nginx too.
                curl -fsS http://127.0.0.1/health && exit 0
                echo "API answers on :8000 but not through nginx on :80" >&2
                exit 1
              fi
              sleep 2
            done
            echo "API did not answer /health within 30s" >&2
            sudo journalctl -u kete-api -n 50 --no-pager >&2
            exit 1
          '
